<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Gino Castillo Petruzzi · Villalba</title>
<meta name="description" content="Ejecutivo de Ventas Zona Sur · Villalba by Kingspan">

<!-- Conexiones tempranas a los 3 orígenes externos que usa la tarjeta -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

<!-- Tipografías: solo los pesos que realmente se usan (600 Cormorant; 300/400/500 DM Sans),
     cargadas sin bloquear el primer render (patrón preload + swap) -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@300;400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@300;400;500&display=swap"></noscript>

<!-- Iconos Tabler: versión fija (no @latest, que obliga a resolver la versión en cada visita)
     y también cargados sin bloquear el primer render -->
<link rel="preload" as="style" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css"></noscript>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #060F1A;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 16px;
    font-family: 'DM Sans', sans-serif;
  }
  .card-wrap {
    background: #0B1C2C;
    border-radius: 24px;
    overflow: hidden;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.5);
  }
  /* TOP */
  .card-top {
    background: #EDEBE6;
    padding: 0 28px 0;
    position: relative;
    overflow: hidden;
  }
  /* LOGO (imagen oficial Villalba by Kingspan, recortada para dejar solo flag + wordmark) */
  .logo-area {
    margin: 0 -28px 12px;
  }
  .logo-area img {
    display: block;
    width: 100%;
    height: auto;
  }
  /* ISO BADGE */
  .iso-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(13,31,51,0.05);
    border: 0.5px solid rgba(13,31,51,0.14);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 10px;
    color: rgba(13,31,51,0.55);
    letter-spacing: 0.06em;
    margin-bottom: 12px;
    position: relative;
    z-index: 1;
  }
  .iso-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #4ABFAA;
    flex-shrink: 0;
  }
  /* NOMBRE */
  .card-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 30px;
    font-weight: 600;
    color: #0D1F33;
    line-height: 1.1;
    margin-bottom: 4px;
    letter-spacing: -0.01em;
    position: relative;
    z-index: 1;
  }
  .card-role {
    font-size: 11px;
    font-weight: 300;
    color: rgba(13,31,51,0.55);
    letter-spacing: 0.13em;
    text-transform: uppercase;
    margin-bottom: 12px;
    position: relative;
    z-index: 1;
  }
  .accent-line {
    width: 34px; height: 2px;
    background: #4ABFAA;
    border-radius: 2px;
    margin-bottom: 12px;
    position: relative;
    z-index: 1;
  }
  /* CONFIANZA EN ACEROS — cinta a todo el ancho, como en la tarjeta física */
  .trust-strip {
    background: linear-gradient(115deg, #050D18 0%, #0C2038 45%, #144677 100%);
    margin: 14px -28px 0;
    padding: 9px 28px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
    z-index: 1;
  }
  .trust-strip img { display: block; height: 14px; width: auto; }
  .trust-strip span {
    font-size: 12px;
    color: #FFFFFF;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    font-weight: 500;
  }
  /* MID */
  .card-mid {
    background: #FFFFFF;
    padding: 10px 28px;
    border-bottom: 0.5px solid rgba(13,31,51,0.08);
  }
  .territory {
    font-size: 12px;
    color: #000000;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .territory i { font-size: 15px; color: #1E7FD4; }
  /* ACTIONS */
  .card-actions {
    background: #071523;
    padding: 14px 28px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .action-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    background: rgba(255,255,255,0.04);
    border: 0.5px solid rgba(255,255,255,0.09);
    border-radius: 14px;
    padding: 11px 10px;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.2s, border-color 0.2s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .action-btn:active { transform: scale(0.97); }
  .action-btn:hover {
    background: rgba(74,191,170,0.09);
    border-color: rgba(74,191,170,0.35);
  }
  .action-btn i { font-size: 22px; color: #4ABFAA; }
  .action-btn span {
    font-size: 11px;
    color: rgba(255,255,255,0.55);
    text-align: center;
    line-height: 1.35;
  }
  .action-btn.full-width {
    grid-column: 1 / -1;
    flex-direction: row;
    justify-content: center;
    gap: 10px;
    padding: 12px 20px;
  }
  .action-btn.full-width i { font-size: 19px; }
  .action-btn.full-width span {
    font-size: 12px;
    color: rgba(255,255,255,0.7);
    font-weight: 500;
  }
  /* WHATSAPP */
  .wa-btn {
    background: rgba(37,211,102,0.1);
    border-color: rgba(37,211,102,0.25);
  }
  .wa-btn i { color: #25D366; }
  .wa-btn:hover {
    background: rgba(37,211,102,0.17);
    border-color: rgba(37,211,102,0.45);
  }
  /* VCF */
  .vcf-btn {
    background: rgba(74,120,191,0.1);
    border-color: rgba(74,120,191,0.28);
  }
  .vcf-btn i { color: #6B9FE4; }
  .vcf-btn span { color: rgba(255,255,255,0.75); }
  .vcf-btn:hover {
    background: rgba(74,120,191,0.18);
    border-color: rgba(74,120,191,0.45);
  }
  /* FOOTER */
  .card-footer {
    background: #060F1A;
    padding: 10px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .footer-web { font-size: 11px; color: rgba(255,255,255,0.25); letter-spacing: 0.04em; }
  .footer-web strong { color: rgba(255,255,255,0.5); font-weight: 400; }
  .footer-address { font-size: 10px; color: rgba(255,255,255,0.18); text-align: right; line-height: 1.5; }
</style>
</head>
